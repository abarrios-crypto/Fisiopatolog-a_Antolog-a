<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antología Fisiopatología</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --verde-sidebar: #0f2319; 
            --verde-activo: #264835; 
            --verde-fondo-dash: #e4ece7; 
            --oro-editorial: #cba34d; 
            --texto-oscuro: #1A1A1A;
        }

        body {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: white;
            color: var(--texto-oscuro);
        }

        /* --- PANTALLA DE LOGIN --- */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .login-box { background: transparent; padding: 40px; text-align: center; width: 320px; }
        .login-box h2 { font-family: 'Playfair Display', serif; color: var(--verde-sidebar); font-size: 2.4rem; margin-bottom: 5px; }
        .login-box p { font-family: 'Montserrat', sans-serif; font-size: 0.85rem; color: #6a767d; margin-bottom: 35px; }
        .login-box input { width: 100%; padding: 14px; margin-bottom: 18px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Montserrat', sans-serif; box-sizing: border-box; }
        .login-box button { width: 100%; background-color: var(--verde-sidebar); color: var(--oro-editorial); border: none; padding: 15px; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.9rem; cursor: pointer; letter-spacing: 2px; border-radius: 4px; }

        /* --- TELÓN / OVERLAY PARA MENÚS EN MÓVIL --- */
        #backdrop-mobile {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1500;
            backdrop-filter: blur(2px);
        }

        /* --- BOTÓN DE CERRAR (SOLO PARA MÓVIL) --- */
        .btn-cerrar-movil {
            display: none; /* Oculto en PC */
        }

        /* --- MENÚ LATERAL --- */
        #sidebar {
            width: 260px;
            background-color: var(--verde-sidebar);
            color: white;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: all 0.3s ease;
            z-index: 2000;
        }
        #sidebar-header {
            padding: 20px 20px 25px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(203, 163, 77, 0.4);
            margin-bottom: 15px;
        }
        #sidebar-header h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: #ffffff; margin: 0; letter-spacing: 2px; }
        #sidebar-header p { font-family: 'Montserrat', sans-serif; font-size: 0.7rem; color: var(--oro-editorial); letter-spacing: 3px; text-transform: uppercase; margin: 5px 0 0 0; font-weight: 600; }
        #menu-lista { list-style: none; padding: 0; margin: 0; }
        
        .menu-item {
            padding: 14px 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            color: #8fa096;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            margin-bottom: 2px;
        }
        .menu-item:hover { color: #ffffff; }
        .menu-item.active {
            background-color: var(--verde-activo);
            color: #ffffff;
            border-left: 3px solid var(--oro-editorial);
            margin-right: 15px;
            border-radius: 0 6px 6px 0;
            font-weight: 600;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        #main-content {
            flex: 1; 
            display: flex;
            flex-direction: row; 
            background-color: white;
            position: relative;
            overflow: hidden; 
        }

        /* --- DASHBOARD GAMIFICACIÓN --- */
        #dashboard-panel {
            width: 320px;
            background-color: var(--verde-fondo-dash);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: all 0.3s ease;
            border-right: 1px solid #d0dad4;
            overflow-y: auto;
            z-index: 2000;
        }
        .card { background: white; padding: 25px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); border-top: 3px solid var(--oro-editorial); }
        .card h3 { font-family: 'Playfair Display', serif; margin: 0 0 10px 0; font-size: 1.4rem; color: #111; display: flex; justify-content: space-between;}
        .card p { font-family: 'Montserrat', sans-serif; font-size: 0.75rem; color: #666; line-height: 1.6; }
        .input-group { display: flex; gap: 10px; margin-top: 15px; flex-direction: column;}
        .input-group input { padding: 12px; border: 1px solid #e0e0e0; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 0.8rem; outline: none; box-sizing: border-box;}
        
        .btn-primary { 
            background: var(--verde-sidebar); color: var(--oro-editorial); border: none; padding: 12px 15px; cursor: pointer; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.75rem; letter-spacing: 1.5px; transition: opacity 0.3s;
        }
        .btn-primary:hover { opacity: 0.9; }

        /* --- VISOR DE DOCUMENTO --- */
        #visor-wrapper {
            flex: 1; 
            overflow-y: auto;
            padding: 30px 60px;
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* BARRA SUPERIOR PARA COLAPSAR MENÚS */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 30px;
            gap: 10px;
        }
        .btn-nav { font-family: 'Montserrat', sans-serif; font-size: 0.75rem; padding: 8px 15px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 20px; color: #555; font-weight: 600; transition: background 0.3s; }
        .btn-nav:hover { background: var(--verde-fondo-dash); }

        #titulo-visor { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 3rem); color: var(--verde-sidebar); text-align: center; margin: 0 0 10px 0; letter-spacing: 2px; }
        #subtitulo-unidad { font-family: 'Montserrat', sans-serif; font-size: 0.85rem; color: var(--oro-editorial); text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; font-weight: 600; }

        /* Clases utilitarias para colapsar paneles */
        .collapsed {
            width: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            border: none !important;
            opacity: 0;
            margin: 0 !important;
        }

        /* Letra capitular */
        .article-body > p:first-of-type::first-letter {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            float: left;
            line-height: 0.8;
            margin-right: 10px;
            margin-top: 5px;
            color: var(--verde-sidebar);
        }

        /* Estilo responsivo específico para el texto "FISIOPATOLOGÍA" de la Portada */
        .titulo-fisiopatologia {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 6.5vw, 3rem);
            color: var(--verde-sidebar);
            letter-spacing: clamp(1px, 1vw, 5px);
            margin: 20px 0;
            text-align: center;
            max-width: 100%;
            word-wrap: break-word;
            hyphens: auto;
        }

        /* =========================================
           MAGIA RESPONSIVA PARA CELULARES
        ========================================= */
        @media (max-width: 850px) {
            body { position: relative; }
            
            /* Ancho máximo de 85% para dejar ver el fondo */
            #sidebar {
                position: absolute; left: 0; top: 0; height: 100%;
                box-shadow: 4px 0 15px rgba(0,0,0,0.4);
                max-width: 85vw; 
            }
            #dashboard-panel {
                position: absolute; right: 0; top: 0; height: 100%;
                box-shadow: -4px 0 15px rgba(0,0,0,0.2);
                max-width: 85vw;
                padding: 20px; /* Un poco menos de relleno interno en celular */
            }
            
            /* Estilos del botón volver a la lectura */
            .btn-cerrar-movil {
                display: block;
                background: transparent;
                border: 1px solid currentColor;
                padding: 12px;
                margin: 15px 15px 5px 15px;
                border-radius: 4px;
                font-family: 'Montserrat', sans-serif;
                font-size: 0.75rem;
                font-weight: 600;
                cursor: pointer;
                text-align: center;
                text-transform: uppercase;
                letter-spacing: 1px;
                opacity: 0.8;
            }
            #sidebar .btn-cerrar-movil { color: var(--oro-editorial); border-color: rgba(203, 163, 77, 0.4); }
            #dashboard-panel .btn-cerrar-movil { color: var(--verde-sidebar); border-color: rgba(15, 35, 25, 0.2); margin: 0 0 15px 0;}

            #visor-wrapper {
                padding: 20px 15px;
                width: 100%;
                box-sizing: border-box;
            }
            .btn-nav { flex: 1; text-align: center; padding: 10px 5px; }
            .login-box { width: 90%; padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>Acceso</h2>
            <p>Antología de Fisiopatología</p>
            <input type="text" id="estudiante-id" placeholder="Matrícula / ID">
            <input type="password" id="estudiante-pass" placeholder="Contraseña">
            <button onclick="iniciarSesion()">INGRESAR</button>
        </div>
    </div>

    <div id="backdrop-mobile" onclick="cerrarPanelesMovil()"></div>

    <div id="sidebar">
        <button class="btn-cerrar-movil" onclick="cerrarPanelesMovil()">✕ Volver a la lectura</button>
        
        <div id="sidebar-header">
            <h1>ANTOLOGÍA</h1>
            <p>FISIOPATOLOGÍA</p>
        </div>
        <ul id="menu-lista"></ul>
    </div>

    <div id="main-content">
        
        <div id="dashboard-panel">
            <button class="btn-cerrar-movil" onclick="cerrarPanelesMovil()">✕ Volver a la lectura</button>

            
            <div class="card">
                <h3>Pase de Salida <span>🎓</span></h3>
                <p>Completa la lectura del tema para habilitar la actividad interactiva de cierre:</p>
                <div style="margin-top: 15px; border: 1.5px dashed var(--oro-editorial); padding: 5px; border-radius: 6px;">
                    <button class="btn-primary" style="width: 100%;" onclick="pedirPreguntaPaseSalida(temaSeleccionado)">COMPLETAR ACTIVIDAD</button>
                </div>
            </div>
        </div>

        <div id="visor-wrapper">
            <div class="top-nav">
                <button id="btn-menu" class="btn-nav" onclick="togglePanel('sidebar', 'btn-menu')">☰ Mostrar Menú</button>
                <button id="btn-progreso" class="btn-nav" onclick="togglePanel('dashboard-panel', 'btn-progreso')">Mostrar Progreso ⚑</button>
            </div>

            <h1 id="titulo-visor">Cargando...</h1>
            <div id="subtitulo-unidad">Por favor espera</div>
            <div id="cuerpo-visor"></div>
        </div>
    </div>

    <script>
        let datosGlobales = {}; 
        let temaSeleccionado = '';
        let usuarioActual = null;
        let temasDesbloqueados = false; 
        
        const URL_GAS = "https://script.google.com/macros/s/AKfycbwkO5qfrSCLHQv2ACF2bs_Ci7wefwWwOyz-taOJJLkao_yQKNqTQuF1vM9gfdMQIzo/exec";
        // ➕ Agregamos la URL del servidor de Asistencias / Pases:
        const URL_GAS_PASES = "https://script.google.com/macros/s/AKfycbzzgskaZuX8AF7ne7zn0cWsx-lh6BNn9l8E5FLUd8KOoBDa_CDz0SKShc5eXcsa3GyH/exec";

        function verificarLlave() {
            const llaveInput = document.getElementById('llave-acceso').value.trim().toUpperCase();
            if(llaveInput === "MAESTRO2026") {
                temasDesbloqueados = true;
                alert("¡Llave correcta! Se han desbloqueado todos los temas de la antología.");
                document.getElementById('llave-acceso').value = ""; 
                poblarMenuLateral(); 
                
                // Si está en celular, cerramos el panel de progreso tras liberar para que vea los resultados
                if(window.innerWidth <= 850) {
                    cerrarPanelesMovil();
                }
            } else {
                alert("Llave de acceso no válida. Intenta de nuevo.");
            }
        }

        function togglePanel(panelId, btnId) {
            const panel = document.getElementById(panelId);
            const otroPanelId = (panelId === 'sidebar') ? 'dashboard-panel' : 'sidebar';
            const otroBtnId = (panelId === 'sidebar') ? 'btn-progreso' : 'btn-menu';
            const otroPanel = document.getElementById(otroPanelId);

            if (window.innerWidth <= 850 && panel.classList.contains('collapsed')) {
                otroPanel.classList.add('collapsed');
                actualizarTextoBoton(otroPanelId, otroBtnId);
            }

            panel.classList.toggle('collapsed');
            actualizarTextoBoton(panelId, btnId);
            comprobarBackdrop();
        }

        function actualizarTextoBoton(panelId, btnId) {
            const panel = document.getElementById(panelId);
            const btn = document.getElementById(btnId);
            const isSidebar = (panelId === 'sidebar');

            if (panel.classList.contains('collapsed')) {
                btn.innerText = isSidebar ? '☰ Mostrar Menú' : 'Mostrar Progreso ⚑';
            } else {
                btn.innerText = isSidebar ? '☰ Ocultar Menú' : 'Ocultar Progreso ⚑';
            }
        }

        function comprobarBackdrop() {
            const sidebar = document.getElementById('sidebar');
            const dash = document.getElementById('dashboard-panel');
            const backdrop = document.getElementById('backdrop-mobile');

            if (window.innerWidth <= 850) {
                if (!sidebar.classList.contains('collapsed') || !dash.classList.contains('collapsed')) {
                    backdrop.style.display = 'block';
                } else {
                    backdrop.style.display = 'none';
                }
            } else {
                backdrop.style.display = 'none';
            }
        }

        function cerrarPanelesMovil() {
            if (window.innerWidth <= 850) {
                document.getElementById('sidebar').classList.add('collapsed');
                document.getElementById('dashboard-panel').classList.add('collapsed');
                actualizarTextoBoton('sidebar', 'btn-menu');
                actualizarTextoBoton('dashboard-panel', 'btn-progreso');
                comprobarBackdrop();
            }
        }

        async function iniciarSesion() {
    const id = document.getElementById('estudiante-id').value.trim();
    const pass = document.getElementById('estudiante-pass').value.trim();
    const btn = document.querySelector('.login-box button');

    if (!id || !pass) { 
        alert("Por favor, ingresa tu ID y contraseña."); 
        return; 
    }
    
    btn.innerText = "AUTENTICANDO..."; 
    btn.disabled = true;

    try {
        const response = await fetch(`${URL_GAS}?action=login&id=${encodeURIComponent(id)}&pass=${encodeURIComponent(pass)}`);
        const result = await response.json();

        // CANDADO AJUSTADO: Verifica si el login fue exitoso
        if (result.success === true || (result && (result["Portada"] || Object.keys(result).length > 0 && result.success === undefined))) {
            usuarioActual = id;
            datosGlobales = result.data ? result.data : result;
            
            // 👉 NUEVA LÍNEA: Guardamos el progreso de forma global
            window.progresoGlobal = result.progreso || [];

            document.getElementById('login-overlay').style.display = 'none';
            poblarMenuLateral();
            cargarVistaHoja("Portada");
            cerrarPanelesMovil();
        } else {
            alert("Acceso denegado: " + (result.message || result.error || "Credenciales incorrectas."));
        }
    } catch (error) {
        alert("Hubo un problema de conexión con Google. Intenta de nuevo.");
    } finally {
        btn.innerText = "INGRESAR"; 
        btn.disabled = false;
    }
}

        function poblarMenuLateral() {
            const menuLista = document.getElementById('menu-lista');
            menuLista.innerHTML = ''; 
            
            const temas = Object.keys(datosGlobales);
            temas.forEach(tema => {
                const li = document.createElement('li');
                li.className = 'menu-item' + (tema === temaSeleccionado ? ' active' : '');
                
                const esLibre = (tema === "Portada" || tema === "Tema 1" || temasDesbloqueados === true);
                const icono = esLibre ? "🔓" : "🔒";
                
                if(!esLibre) {
                    li.style.opacity = "0.5";
                }

                li.innerHTML = `<span>${tema}</span> <span style="color: var(--oro-editorial); font-size: 0.9rem;">${icono}</span>`;
                
                li.onclick = () => {
                    cargarVistaHoja(tema);
                    cerrarPanelesMovil();
                };
                
                menuLista.appendChild(li);
            });
        }

        function cargarVistaHoja(nombreHoja) {
    temaSeleccionado = nombreHoja;
    const datosHoja = datosGlobales[nombreHoja];
    const tituloVisor = document.getElementById('titulo-visor');
    const subtituloUnidad = document.getElementById('subtitulo-unidad');
    const cuerpoVisor = document.getElementById('cuerpo-visor');
    poblarMenuLateral();

    // 1. Verificamos si es la Portada (siempre abierta) o si el tema está en su progreso
    const esPortada = nombreHoja.toLowerCase() === 'portada';
    const estaDesbloqueado = window.progresoGlobal && window.progresoGlobal.includes(nombreHoja);

    // 2. Si tiene permiso, ejecutamos tu código original de renderizado
    if (esPortada || estaDesbloqueado) {
        if (!datosHoja || datosHoja.length === 0) {
            tituloVisor.innerText = nombreHoja;
            subtituloUnidad.innerText = "";
            cuerpoVisor.innerText = 'Sin contenido.';
            return;
        }

        let unidadTexto = "";
        let tituloTemaTexto = nombreHoja;

        datosHoja.forEach((fila) => {
            const seccion = (fila[0] !== undefined && fila[0] !== null ? String(fila[0]) : "").trim();
            const contenido = (fila[1] !== undefined && fila[1] !== null ? String(fila[1]) : "").trim();
            if (seccion === 'UNIDAD PERTENECIENTE') unidadTexto = contenido;
            else if (seccion === 'TÍTULO DEL TEMA') tituloTemaTexto = contenido;
        });

        let HTMLContenido = "";
        const darFormato = (texto) => {
            if (!texto) return "";
            let f = texto.replace(/\n+/g, '</p><p style="margin-top: 1.2rem; margin-bottom: 1rem !important; text-align: justify;">');
            f = f.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            f = f.replace(/==(.*?)==/g, '<mark style="background-color: rgba(203, 163, 77, 0.2); color: var(--verde-sidebar); font-weight: 600; padding: 2px 6px; border-radius: 4px;">$1</mark>');
            f = f.replace(/_(.*?)_/g, '<em>$1</em>');
            f = f.replace(/\*(.*?)\*/g, '<em>$1</em>');
            return f;
        };

        if (esPortada) {
            HTMLContenido += '<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; margin-top: 10px; padding: 0 10px;">';
            datosHoja.forEach((fila) => {
                const seccion = (fila[0] !== undefined && fila[0] !== null ? String(fila[0]) : "").trim();
                if (seccion === 'UNIDAD PERTENECIENTE' || seccion === 'TÍTULO DEL TEMA' || seccion.startsWith('RECURSO_') || seccion === "") return;
                
                let estilo = "";
                const esMayusculas = seccion === seccion.toUpperCase() && /[A-ZÁÉÍÓÚ]/.test(seccion);
                
                if (seccion.includes("UNIVERSIDAD") || seccion.includes("SINALOA") || seccion === "ANTOLOGÍA") {
                    estilo = "font-family: 'Montserrat', sans-serif; font-size: clamp(0.7rem, 2.5vw, 0.85rem); color: var(--oro-editorial); letter-spacing: 2px; text-transform: uppercase; margin-bottom: -5px;";
                } else if (seccion === "FISIOPATOLOGÍA") {
                    HTMLContenido += `<div class="titulo-fisiopatologia">${seccion}</div>`;
                    return;
                } else if (seccion.includes("Índice")) {
                    estilo = "font-family: 'Montserrat', sans-serif; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid var(--oro-editorial); color: var(--verde-sidebar); padding-bottom: 5px; margin-top: 30px;";
                } else if (esMayusculas) {
                    estilo = "font-family: 'Playfair Display', serif; font-size: clamp(1rem, 3.5vw, 1.3rem); color: var(--verde-sidebar); letter-spacing: 2px; margin-top: 15px;";
                } else {
                    estilo = "font-family: 'Cormorant Garamond', serif; font-size: clamp(1.1rem, 4vw, 1.35rem); color: #444; font-style: italic;";
                }
                HTMLContenido += `<div style="${estilo}">${seccion}</div>`;
            });
            HTMLContenido += '</div>';
        } else {
            HTMLContenido += '<div style="padding-bottom: 40px; margin-top: 10px;">';
            let isArticleBodyOpen = false;
            datosHoja.forEach((fila) => {
                const seccion = (fila[0] !== undefined && fila[0] !== null ? String(fila[0]) : "").trim();
                const contenido = (fila[1] !== undefined && fila[1] !== null ? String(fila[1]) : "").trim();
                
                if (seccion === 'UNIDAD PERTENECIENTE' || seccion === 'TÍTULO DEL TEMA' || seccion.startsWith('RECURSO_')) return;
                if (seccion === "" && contenido === "") return;
                
                if (seccion !== "") {
                    if (isArticleBodyOpen) { HTMLContenido += '</div></div>'; isArticleBodyOpen = false; }
                    HTMLContenido += '<div class="section-block" style="margin-top: 2.5rem !important; margin-bottom: 0 !important;">';
                    HTMLContenido += '<div style="border-top: 1px solid rgba(203, 163, 77, 0.3); width: 100%; margin-bottom: 1rem;"></div>';
                    HTMLContenido += `<h2 class="section-heading" style="margin-bottom: 1rem !important; font-size: 1.4rem !important; font-family: 'Playfair Display', serif; color: var(--verde-sidebar); ">${seccion}</h2>`;
                    
                    if (contenido !== "") {
                        HTMLContenido += '<div class="article-body" style="margin-top: 0 !important; font-size: clamp(1.1rem, 1.2vw + 0.9rem, 1.35rem) !important; line-height: 1.7 !important; color: #2c2c2c;">';
                        if (contenido.startsWith('>>')) {
                            HTMLContenido += `<div style="background-color: #f7f9f8; border-left: 4px solid var(--verde-sidebar); padding: 15px 20px; margin: 1.5rem 0; font-style: italic; font-family: 'Cormorant Garamond', serif; font-size: 1.25rem;"><p style="margin: 0; text-align: justify;">${darFormato(contenido.substring(2).trim())}</p></div>`;
                        } else {
                            HTMLContenido += `<p style="margin-top: 0; margin-bottom: 1rem !important; text-align: justify;">${darFormato(contenido)}</p>`;
                        }
                        isArticleBodyOpen = true;
                    }
                } else if (contenido !== "") {
                    if (!isArticleBodyOpen) {
                        HTMLContenido += '<div class="section-block" style="margin-top: 2rem !important; margin-bottom: 0 !important;">';
                        HTMLContenido += '<div class="article-body" style="margin-top: 0 !important; font-size: clamp(1.1rem, 1.2vw + 0.9rem, 1.35rem) !important; line-height: 1.7 !important; color: #2c2c2c;">';
                        isArticleBodyOpen = true;
                    }
                    if (contenido.startsWith('>>')) {
                        HTMLContenido += `<div style="background-color: #f7f9f8; border-left: 4px solid var(--verde-sidebar); padding: 15px 20px; margin: 1.5rem 0; font-style: italic; font-family: 'Cormorant Garamond', serif; font-size: 1.25rem;"><p style="margin: 0; text-align: justify;">${darFormato(contenido.substring(2).trim())}</p></div>`;
                    } else {
                        HTMLContenido += `<p style="margin-top: 0; margin-bottom: 1rem !important; text-align: justify;">${darFormato(contenido)}</p>`;
                    }
                }
            });
            if (isArticleBodyOpen) HTMLContenido += '</div></div>';
            HTMLContenido += '</div>';
        }

        if (esPortada) { 
            tituloVisor.innerText = ""; 
            subtituloUnidad.innerText = ""; 
        } else {
            tituloVisor.innerText = tituloTemaTexto;
            subtituloUnidad.innerText = unidadTexto;
        }
        
        cuerpoVisor.innerHTML = HTMLContenido || '<p>Contenido en edición.</p>';

    } else {
        // 3. PANTALLA DE BLOQUEO
        tituloVisor.innerText = "Acceso Restringido";
        subtituloUnidad.innerText = "";
        
        cuerpoVisor.innerHTML = `
            <div style="text-align: center; padding: 50px 20px; font-family: sans-serif; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 30px;">
                <h2 style="color: #333; margin-bottom: 10px;">🔒 Contenido Bloqueado</h2>
                <p style="color: #666; margin-bottom: 25px; line-height: 1.5; font-size: 1.1rem;">
                    Para acceder al contenido de <b>${nombreHoja}</b>, necesitas la llave de acceso.<br>
                    Completa el SCORM correspondiente en <b>DreamLab</b> para obtenerla.
                </p>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
                    <input type="text" id="input-llave-tema" placeholder="Ingresa tu llave de acceso..." 
                           style="padding: 12px; width: 80%; max-width: 300px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; text-align: center;">
                    
                    <button onclick="verificarLlaveSCORM('${nombreHoja}')" 
                            style="padding: 12px 25px; background-color: var(--verde-sidebar); color: var(--oro-editorial); border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; letter-spacing: 1px;">
                        DESBLOQUEAR TEMA
                    </button>
                </div>
            </div>
        `;
    }
}

async function verificarLlaveSCORM(nombreHoja) {
    const inputLlave = document.getElementById('input-llave-tema').value.trim();
    
    if (inputLlave === "") {
        alert("Por favor, ingresa una llave.");
        return;
    }

    if (!usuarioActual) {
        alert("Error: No se detectó la sesión del usuario.");
        return;
    }

    // Buscamos el botón para deshabilitarlo mientras carga
    const btn = document.querySelector('button[onclick^="verificarLlaveSCORM"]');
    const btnOriginalText = btn.innerText;
    btn.innerText = "VERIFICANDO...";
    btn.disabled = true;

    try {
        const url = `${URL_GAS}?action=validarLlave&id=${encodeURIComponent(usuarioActual)}&tema=${encodeURIComponent(nombreHoja)}&llave=${encodeURIComponent(inputLlave)}`;
        const response = await fetch(url);
        const result = await response.json();

        if (result.success === true) {
            alert("¡Llave correcta! Tema desbloqueado.");
            
            // Añadimos el tema a la memoria temporal
            if (!window.progresoGlobal) window.progresoGlobal = [];
            window.progresoGlobal.push(nombreHoja);
            
            // Recargamos la vista, ahora pasará el Guardián
            cargarVistaHoja(nombreHoja);
        } else {
            alert(result.mensaje || "Llave incorrecta. Asegúrate de haber completado el SCORM.");
        }
    } catch (error) {
        alert("Hubo un problema de conexión al verificar la llave con el servidor.");
    } finally {
        if (btn) {
            btn.innerText = btnOriginalText;
            btn.disabled = false;
        }
    }
}

        // Variable global para almacenar la materia (se actualiza al iniciar sesión)
var materiaUsuario = "Fisiopatologia"; 

// Función para consultar la pregunta del Pase de Salida
async function pedirPreguntaPaseSalida(nombreTema) {
    if (!nombreTema || nombreTema.toLowerCase() === "portada") {
        alert("Por favor, abre un tema de estudio para poder realizar el Pase de Salida.");
        return;
    }

    try {
        // 👉 Cambiamos URL_GAS por URL_GAS_PASES
        const url = `${URL_GAS_PASES}?accion=obtenerPreguntaAzar&tema=${encodeURIComponent(nombreTema)}&materia=${encodeURIComponent(materiaUsuario)}`;
        
        const respuesta = await fetch(url);
        const datos = await respuesta.json();

        if (datos.status === "success") {
            mostrarModalPregunta(datos.pregunta, nombreTema);
        } else {
            alert("Atención: " + datos.mensaje);
        }
    } catch (error) {
        alert("Hubo un problema de conexión al obtener la pregunta.");
    }
}
// Función para desplegar la pregunta y validar la respuesta del alumno
function mostrarModalPregunta(preguntaObj, nombreTema) {
    // Armamos el texto con la pregunta y las 4 opciones 📋
    const mensajeModal = 
        `EVALUACIÓN DE PASE DE SALIDA (${nombreTema})\n\n` +
        `${preguntaObj.pregunta}\n\n` +
        `A) ${preguntaObj.opcionA}\n` +
        `B) ${preguntaObj.opcionB}\n` +
        `C) ${preguntaObj.opcionC}\n` +
        `D) ${preguntaObj.opcionD}\n\n` +
        `Escribe la letra de tu respuesta (A, B, C o D):`;

    // Mostramos la pregunta al alumno 💬
    const respuestaAlumno = prompt(mensajeModal);

    if (!respuestaAlumno) return; // Si cancela la ventana, salimos

    // Comparación sin importar si escribe en mayúscula o minúscula
    const seleccion = respuestaAlumno.trim().toUpperCase();
    const correcta = String(preguntaObj.correcta).trim().toUpperCase();

    if (seleccion === correcta) {
        alert("¡Respuesta correcta! Generando tu Pase de Salida...");
        // Llamaremos a la función del Paso 4 para guardar el código en el Sheet
        generarYEnviarPase(nombreTema);
    } else {
        alert("❌ Respuesta incorrecta. Vuelve a revisar la lectura e inténtalo de nuevo.");
    }
}

        // Función para generar la clave única y enviarla al servidor
async function generarYEnviarPase(nombreTema) {
    const hashGenerado = "P-" + Math.random().toString(36).substring(2, 8).toUpperCase();

    const payload = {
        matricula: usuarioActual,
        tema: nombreTema,
        llaveDigital: hashGenerado,
        tipoRecurso: "PASE"
    };

    try {
        // 🔒 Enviamos con mode: 'no-cors' para evitar el bloqueo de lectura del navegador
        await fetch(URL_GAS_PASES, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        });

        // 🌐 Al completarse la petición sin errores de red, confirmamos el registro
        alert(`🎉 ¡Pase de Salida registrado con éxito!\n\nTu Clave de Verificación: ${hashGenerado}`);

    } catch (error) {
        alert(`Error de conexión: ${error.message}`);
    }
}
